<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NetBattle</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      /* Info panel, shown after hovering a fighter for 2 seconds. */
      #info {
        --accent: #e53935;
        position: fixed;
        left: 0;
        top: 0;
        width: 248px;
        box-sizing: border-box;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(18, 18, 24, 0.94);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        color: #ececf1;
        font: 12px/1.35 'Segoe UI', system-ui, -apple-system, sans-serif;
        z-index: 10;
      }
      #info[hidden] {
        display: none;
      }
      #info .head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
      }
      #info .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
      }
      #info .sub {
        color: #a0a0ad;
      }
      #info .role {
        margin-bottom: 4px;
        color: #c9c9d3;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #info .lv {
        padding: 0 6px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 11px;
        font-weight: 600;
      }
      #info .x {
        margin-left: auto;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #a0a0ad;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }
      #info .x:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }
      #info .label {
        margin: 8px 0 5px;
        color: #a0a0ad;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      #info .row {
        display: flex;
        justify-content: space-between;
        margin: 3px 0;
        color: #a0a0ad;
      }
      #info .row b {
        color: #ececf1;
        font-weight: 600;
      }
      #info .bar {
        height: 5px;
        margin: 4px 0 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      #info .bar i {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      #info .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        text-align: center;
      }
      #info .grid b {
        display: block;
        font-size: 15px;
      }
      #info .grid span,
      #info .soon {
        color: #7d7d89;
        font-size: 10px;
        text-transform: none;
        letter-spacing: 0;
      }
      #info .stat {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      #info .stat span {
        width: 58px;
        color: #a0a0ad;
      }
      #info .pips {
        display: flex;
        gap: 2px;
        flex: 1;
      }
      #info .pips i {
        flex: 1;
        height: 8px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.1);
      }
      #info .pips i.on {
        background: var(--accent);
      }
      #info .stat button {
        width: 20px;
        height: 20px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 5px;
        background: transparent;
        color: #7d7d89;
        font: inherit;
        line-height: 1;
      }
      #info .stat button:not(:disabled) {
        border-color: var(--accent);
        color: #ececf1;
        cursor: pointer;
      }
      #info .stat button:not(:disabled):hover {
        background: var(--accent);
      }
      #info .note {
        margin-top: 8px;
        color: #7d7d89;
        font-size: 11px;
      }
      #info .note.prot {
        color: #7fd1ff;
      }
      /* Floating text above a fighter: level-ups and knockout losses. */
      #floats {
        position: fixed;
        left: 0;
        top: 0;
        pointer-events: none;
        z-index: 9;
      }
      #floats .float {
        position: absolute;
        left: 0;
        top: 0;
      }
      #floats .float span {
        display: block;
        transform: translateX(-50%);
        white-space: nowrap;
        font: 800 15px 'Segoe UI', system-ui, sans-serif;
        text-shadow: 0 0 3px #000, 0 1px 2px #000;
        animation: floatup 2s ease-out forwards;
      }
      #floats .float span.level {
        color: #ffd54f;
      }
      #floats .float span.loss {
        color: #ff5252;
      }
      @keyframes floatup {
        0% {
          opacity: 0;
          margin-top: 10px;
        }
        12% {
          opacity: 1;
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          margin-top: -24px;
        }
      }
      .sprite {
        position: fixed;
        left: 0;
        top: 0;
        pointer-events: none;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div id="info" hidden></div>
    <script src="progression.js"></script>
    <script src="main.js"></script>
  </body>
</html>

[package]
name = "netbattle"
version = "0.1.0"
description = "Two kung fu stick figures fighting over your network traffic"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["network"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
